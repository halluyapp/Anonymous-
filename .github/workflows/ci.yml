name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.AFTER_DARK_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.AFTER_DARK_SUPABASE_PUBLISHABLE_KEY }}
      - run: npx expo export --platform android --output-dir ../../dist-mobile
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.AFTER_DARK_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.AFTER_DARK_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.AFTER_DARK_WEB_URL }}
