name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.AFTER_DARK_SUPABASE_URL || 'https://bkhldfjqxarnqmcidwog.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.AFTER_DARK_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_nSiFOIthyCgonT-zq4OJDg_PkUjYe0H' }}
      EXPO_PUBLIC_WEB_URL: ${{ vars.AFTER_DARK_WEB_URL || 'https://after-dark-one-xi.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: test -n "$ANDROID_HOME" && test -d "$ANDROID_HOME"
      - run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || (echo 'Set repository variable SUPABASE_URL' && exit 1)
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || (echo 'Set repository variable SUPABASE_PUBLISHABLE_KEY' && exit 1)
          if [ -z "$EXPO_PUBLIC_WEB_URL" ]; then echo 'Warning: link sharing is disabled until AFTER_DARK_WEB_URL is configured.'; fi
      - run: npm ci
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - name: Assemble standalone test-signed APK
        run: |
          set +e
          ./gradlew assembleRelease > "$RUNNER_TEMP/android-build.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/android-build.log"
          if [ "$result" -ne 0 ]; then
            echo '::group::Android build failure diagnostics'
            grep -E '(^e: |^\* What went wrong:|^> |error:|FAILED|Could not|Exception)' "$RUNNER_TEMP/android-build.log" | tail -n 30 || true
            echo '::endgroup::'
            # Annotations remain accessible through the GitHub API if logs are unavailable.
            tail -n 60 "$RUNNER_TEMP/android-build.log" | while IFS= read -r line; do
              line="${line//'%'/'%25'}"; line="${line//$'\r'/'%0D'}"; line="${line//$'\n'/'%0A'}"
              echo "::error::$line"
            done
          fi
          exit "$result"
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: after-dark-test-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
